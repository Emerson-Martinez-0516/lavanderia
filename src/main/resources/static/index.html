<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lavandería | Órdenes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --color-principal: #176b87;
            --color-secundario: #64ccc5;
            --color-fondo: #f4f8fa;
            --color-texto: #24343b;
        }
        body { background-color: var(--color-fondo); color: var(--color-texto); min-height: 100vh; }
        .encabezado {
            color: white;
            background: linear-gradient(135deg, #0d4c67, #176b87, #64ccc5);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.15);
        }
        .tarjeta-formulario, .tarjeta-listado {
            border: none;
            border-radius: 18px;
            box-shadow: 0 8px 28px rgba(34, 64, 74, 0.10);
        }
        .tarjeta-formulario { position: sticky; top: 25px; }
        .form-control, .form-select { border-radius: 10px; }
        .form-control:focus, .form-select:focus {
            border-color: var(--color-secundario);
            box-shadow: 0 0 0 0.2rem rgba(100, 204, 197, 0.25);
        }
        .btn-lavanderia { color: white; background-color: var(--color-principal); border: none; border-radius: 10px; }
        .btn-lavanderia:hover { color: white; background-color: #0d4c67; }
        .table thead th { color: var(--color-principal); white-space: nowrap; }
        footer { color: #62747c; }
        @media (max-width: 991px) { .tarjeta-formulario { position: static; } }
    </style>
</head>
<body>
<header class="encabezado">
    <div class="container py-5 d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
        <div>
            <h1 class="fw-bold">🧺 Lavandería</h1>
            <p class="mb-0">Seguimiento de órdenes de lavado</p>
        </div>
        <div class="text-md-end">
            <small>Total esperado del día</small>
            <div class="fs-2 fw-bold" id="totalDia">Q 0.00</div>
        </div>
    </div>
</header>

<main class="container my-5">
    <div id="mensaje"></div>
    <div class="row g-4">

        <section class="col-lg-4">
            <div class="card tarjeta-formulario">
                <div class="card-body p-4">
                    <h2 id="tituloFormulario" class="h4 mb-4">Registrar orden</h2>

                    <form id="formOrden" novalidate>
                        <input type="hidden" id="id">

                        <div class="mb-3">
                            <label for="cliente" class="form-label">Cliente</label>
                            <input type="text" id="cliente" class="form-control" placeholder="Nombre del cliente" maxlength="100">
                        </div>

                        <div class="mb-3">
                            <label for="tipoServicio" class="form-label">Tipo de servicio</label>
                            <select id="tipoServicio" class="form-select"></select>
                        </div>

                        <div class="mb-3">
                            <label for="peso" class="form-label">Peso en libras</label>
                            <input type="number" id="peso" class="form-control" step="0.01" placeholder="5.00">
                        </div>

                        <div class="alert alert-info py-2">
                            Costo estimado: <strong id="costoEstimado">Q 0.00</strong>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" id="btnGuardar" class="btn btn-lavanderia">Guardar orden</button>
                            <button type="button" class="btn btn-outline-secondary" onclick="limpiarFormulario()">
                                Limpiar formulario
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </section>

        <section class="col-lg-8">
            <div class="card tarjeta-listado">
                <div class="card-body p-4">

                    <h2 class="h4 mb-3">Órdenes registradas</h2>

                    <div class="row g-2 mb-4">
                        <div class="col-md-4">
                            <select id="filtroEstado" class="form-select" onchange="filtrarPorEstado()">
                                <option value="">Filtrar por estado...</option>
                                <option value="RECIBIDA">Recibida</option>
                                <option value="EN_PROCESO">En proceso</option>
                                <option value="LISTA">Lista</option>
                                <option value="ENTREGADA">Entregada</option>
                            </select>
                        </div>
                        <div class="col-md-5">
                            <div class="input-group">
                                <input type="text" id="filtroCliente" class="form-control" placeholder="Buscar por cliente">
                                <button class="btn btn-outline-primary" type="button" onclick="filtrarPorCliente()">Buscar</button>
                            </div>
                        </div>
                        <div class="col-md-3 d-grid">
                            <button class="btn btn-outline-success" type="button" onclick="filtrarListas()">
                                Listas para entrega
                            </button>
                        </div>
                        <div class="col-12">
                            <button class="btn btn-sm btn-link" type="button" onclick="recargar()">Ver todas las órdenes</button>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                            <tr>
                                <th>#</th>
                                <th>Cliente</th>
                                <th>Servicio</th>
                                <th>Peso</th>
                                <th>Total</th>
                                <th>Estado</th>
                                <th>Fecha</th>
                                <th>Acciones</th>
                            </tr>
                            </thead>
                            <tbody id="tablaOrdenes"></tbody>
                        </table>
                    </div>

                </div>
            </div>
        </section>
    </div>
</main>

<footer class="text-center py-4">
    <small>Programación II · API REST con Spring Boot</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const API = "/api";

    const ESTADOS = ["RECIBIDA", "EN_PROCESO", "LISTA", "ENTREGADA"];
    const NOMBRES = {
        RECIBIDA: "Recibida",
        EN_PROCESO: "En proceso",
        LISTA: "Lista",
        ENTREGADA: "Entregada"
    };
    const COLORES = {
        RECIBIDA: "secondary",
        EN_PROCESO: "warning text-dark",
        LISTA: "success",
        ENTREGADA: "primary"
    };

    let ordenes = [];
    let tipos = [];

    const formulario = document.getElementById("formOrden");
    const tabla = document.getElementById("tablaOrdenes");
    const campoId = document.getElementById("id");

    document.addEventListener("DOMContentLoaded", () => {
        cargarTipos();
        recargar();
    });

    formulario.addEventListener("submit", guardarOrden);
    document.getElementById("peso").addEventListener("input", calcularCosto);
    document.getElementById("tipoServicio").addEventListener("change", calcularCosto);

    async function pedir(url, opciones) {
        const respuesta = await fetch(url, opciones);
        if (!respuesta.ok) {
            let mensaje = "Ocurrió un error inesperado.";
            try {
                const error = await respuesta.json();
                mensaje = error.mensaje || mensaje;
            } catch (e) {}
            throw new Error(mensaje);
        }
        return respuesta.status === 204 ? null : respuesta.json();
    }

    async function recargar() {
        document.getElementById("filtroEstado").value = "";
        document.getElementById("filtroCliente").value = "";
        await cargarLista(`${API}/ordenes`);
        cargarTotalDia();
    }

    async function cargarLista(url) {
        try {
            ordenes = await pedir(url);
            mostrarOrdenes();
        } catch (error) {
            mostrarMensaje(error.message, "danger");
        }
    }

    async function cargarTipos() {
        try {
            const lista = await pedir(`${API}/tipos-servicio`);
            tipos = lista.filter(t => t.activo);
            const select = document.getElementById("tipoServicio");
            select.innerHTML = `<option value="">Seleccione un servicio</option>` +
                tipos.map(t =>
                    `<option value="${t.id}">${escaparHTML(t.nombre)} (Q ${Number(t.precioPorLibra).toFixed(2)}/lb)</option>`
                ).join("");
        } catch (error) {
            mostrarMensaje(error.message, "danger");
        }
    }

    async function cargarTotalDia() {
        try {
            const dato = await pedir(`${API}/ordenes/total-dia`);
            document.getElementById("totalDia").textContent = "Q " + Number(dato.totalEsperado).toFixed(2);
        } catch (error) {
            mostrarMensaje(error.message, "danger");
        }
    }

    function filtrarPorEstado() {
        const estado = document.getElementById("filtroEstado").value;
        if (estado) cargarLista(`${API}/ordenes/estado/${estado}`);
    }

    function filtrarPorCliente() {
        const cliente = document.getElementById("filtroCliente").value.trim();
        if (!cliente) {
            mostrarMensaje("Escriba el nombre del cliente a buscar.", "warning");
            return;
        }
        cargarLista(`${API}/ordenes/cliente?cliente=${encodeURIComponent(cliente)}`);
    }

    function filtrarListas() {
        cargarLista(`${API}/ordenes/listas`);
    }

    function mostrarOrdenes() {
        if (ordenes.length === 0) {
            tabla.innerHTML = `<tr><td colspan="8" class="text-center text-secondary py-4">No hay órdenes para mostrar.</td></tr>`;
            return;
        }

        tabla.innerHTML = ordenes.map(o => {
            const indice = ESTADOS.indexOf(o.estado);
            const siguiente = ESTADOS[indice + 1];
            const entregada = o.estado === "ENTREGADA";

            return `
                <tr>
                    <td>${o.id}</td>
                    <td>${escaparHTML(o.cliente)}</td>
                    <td>${escaparHTML(o.tipoServicioNombre)}</td>
                    <td>${Number(o.pesoLibras).toFixed(2)} lb</td>
                    <td>Q ${Number(o.total).toFixed(2)}</td>
                    <td><span class="badge bg-${COLORES[o.estado]}">${NOMBRES[o.estado]}</span></td>
                    <td>${o.fechaRecepcion}</td>
                    <td class="text-nowrap">
                        ${siguiente ? `
                            <button class="btn btn-sm btn-success" onclick="avanzarEstado(${o.id}, '${siguiente}')">
                                Pasar a ${NOMBRES[siguiente]}
                            </button>` : ""}
                        ${!entregada ? `
                            <button class="btn btn-sm btn-warning" onclick="editarOrden(${o.id})">Editar</button>
                            <button class="btn btn-sm btn-danger" onclick="eliminarOrden(${o.id})">Eliminar</button>` : ""}
                    </td>
                </tr>
            `;
        }).join("");
    }

    async function guardarOrden(evento) {
        evento.preventDefault();
        const id = campoId.value;
        const tipoId = document.getElementById("tipoServicio").value;

        const orden = {
            cliente: document.getElementById("cliente").value.trim(),
            pesoLibras: Number(document.getElementById("peso").value),
            tipoServicioId: tipoId ? Number(tipoId) : null
        };

        try {
            await pedir(id ? `${API}/ordenes/${id}` : `${API}/ordenes`, {
                method: id ? "PUT" : "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(orden)
            });
            mostrarMensaje(id ? "Orden actualizada correctamente." : "Orden registrada correctamente.", "success");
            limpiarFormulario();
            recargar();
        } catch (error) {
            mostrarMensaje(error.message, "danger");
        }
    }

    function editarOrden(id) {
        const orden = ordenes.find(o => o.id === id);
        if (!orden) return;

        campoId.value = orden.id;
        document.getElementById("cliente").value = orden.cliente;
        document.getElementById("tipoServicio").value = orden.tipoServicioId;
        document.getElementById("peso").value = orden.pesoLibras;
        document.getElementById("tituloFormulario").textContent = "Modificar orden";
        document.getElementById("btnGuardar").textContent = "Actualizar orden";
        calcularCosto();
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function avanzarEstado(id, estado) {
        try {
            await pedir(`${API}/ordenes/${id}/estado`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ estado })
            });
            mostrarMensaje("Estado actualizado correctamente.", "success");
            recargar();
        } catch (error) {
            mostrarMensaje(error.message, "danger");
        }
    }

    async function eliminarOrden(id) {
        if (!confirm("¿Desea eliminar esta orden?")) return;

        try {
            await pedir(`${API}/ordenes/${id}`, { method: "DELETE" });
            mostrarMensaje("Orden eliminada correctamente.", "success");
            if (campoId.value === String(id)) limpiarFormulario();
            recargar();
        } catch (error) {
            mostrarMensaje(error.message, "danger");
        }
    }

    function calcularCosto() {
        const peso = Number(document.getElementById("peso").value);
        const tipo = tipos.find(t => t.id === Number(document.getElementById("tipoServicio").value));
        const total = tipo && peso > 0 ? peso * tipo.precioPorLibra : 0;
        document.getElementById("costoEstimado").textContent = "Q " + total.toFixed(2);
    }

    function limpiarFormulario() {
        formulario.reset();
        campoId.value = "";
        document.getElementById("tituloFormulario").textContent = "Registrar orden";
        document.getElementById("btnGuardar").textContent = "Guardar orden";
        calcularCosto();
    }

    function mostrarMensaje(texto, tipo) {
        const contenedor = document.getElementById("mensaje");
        contenedor.innerHTML = `
            <div class="alert alert-${tipo} alert-dismissible fade show" role="alert">
                ${escaparHTML(texto)}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
            </div>
        `;
        setTimeout(() => { contenedor.innerHTML = ""; }, 5000);
    }

    function escaparHTML(valor) {
        return String(valor ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }
</script>
</body>
</html>
